<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まず5分">
<title>まず5分</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"まず5分","short_name":"まず5分","start_url":".","display":"standalone","background_color":"%23EDF0EB","theme_color":"%23EDF0EB"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---- tokens ----
   paper  #EDF0EB  背景(淡い灰緑)
   card   #FBFCFA  カード
   ink    #26302A  文字
   pine   #33695B  主アクション
   moss   #B4C4B4  枠・弱い文字
   amber  #DFA95C  積み上げブロック
------------------------- */
:root{
  --paper:#EDF0EB; --card:#FBFCFA; --ink:#26302A; --pine:#33695B;
  --moss:#B4C4B4; --moss-weak:#D7E0D6; --amber:#DFA95C; --amber-soft:#F3E2C6;
  --radius-card:20px; --radius-btn:14px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans", sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.7;
  min-height:100dvh; display:flex; flex-direction:column;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:3px solid var(--pine); outline-offset:2px; border-radius:6px;
}
input[type=text], input[type=date], textarea{
  font:inherit; width:100%; background:var(--card);
  border:1.5px solid var(--moss); border-radius:12px; padding:12px 14px; color:var(--ink);
}
textarea{resize:vertical; min-height:96px;}
input[type=date]{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; min-width:0; max-width:100%;
  min-height:49px; text-align:left;
}
input[type=date]::-webkit-date-and-time-value{ text-align:left; margin:0; }
.now-line{ text-align:center; font-size:14px; color:#5C6B5F; margin:6px 0 14px; min-height:1.4em; }
::placeholder{color:#9BAA9C;}
input, textarea{ -webkit-user-select:text; user-select:text; }

header.app{ padding:calc(env(safe-area-inset-top) + 14px) 20px 6px; }
header.app .bar{ position:relative; display:flex; align-items:center; justify-content:center; max-width:430px; margin:0 auto; }
header.app .t{ font-weight:700; font-size:15px; letter-spacing:.2em; color:var(--pine); }
#lang-sel{
  position:absolute; right:0; font:inherit; font-size:13px; color:#5C6B5F;
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:999px;
  padding:4px 10px; -webkit-appearance:none; appearance:none;
}
#help-btn{
  position:absolute; left:0; width:30px; height:30px; border-radius:999px;
  border:1.5px solid var(--moss-weak); background:var(--card);
  color:#5C6B5F; font-weight:700; font-size:15px; line-height:1;
}
.wel-langs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.wel-langs button{
  font-size:12px; padding:4px 10px; border:1.5px solid var(--moss-weak);
  border-radius:999px; color:#5C6B5F; background:var(--card);
}
.wel-langs button[aria-pressed="true"]{ background:var(--pine); border-color:var(--pine); color:#fff; font-weight:700; }

main{ flex:1; width:100%; max-width:430px; margin:0 auto; padding:8px 18px 110px; }
section[hidden]{display:none;}

/* ---- Now ---- */
.now-empty{ text-align:center; padding:56px 8px; }
.now-empty p{ margin-bottom:20px; color:#5C6B5F; }

.card{
  background:var(--card); border-radius:var(--radius-card);
  border:1.5px solid var(--moss-weak);
  box-shadow:0 2px 0 var(--moss-weak);
  padding:26px 22px; transition:background .8s ease;
}
.card.overtime{ background:var(--amber-soft); border-color:var(--amber); }

.proj-name{ font-size:13px; color:#6B7A6E; margin-bottom:6px; }
.action-text{ font-size:24px; font-weight:700; line-height:1.5; }
.resume-note{
  margin-top:14px; font-size:14px; color:#5C6B5F;
  background:var(--paper); border-radius:10px; padding:10px 12px;
}
.resume-note b{ color:var(--pine); font-weight:700; }

.minute-row{ display:flex; gap:10px; margin:22px 0 14px; }
.chip{
  flex:1; padding:10px 0; text-align:center; font-weight:500;
  border:1.5px solid var(--moss); border-radius:var(--radius-btn); background:var(--card);
}
.chip[aria-pressed="true"]{ background:var(--pine); border-color:var(--pine); color:#fff; font-weight:700; }

.btn-main{
  display:block; width:100%; padding:16px 0; text-align:center;
  background:var(--pine); color:#fff; font-size:18px; font-weight:700;
  border-radius:var(--radius-btn);
}
.btn-main:active{ transform:translateY(1px); }
.btn-sub{
  display:block; width:100%; padding:13px 0; text-align:center; margin-top:10px;
  background:var(--card); border:1.5px solid var(--moss); border-radius:var(--radius-btn); font-weight:500;
}
.btn-line{ display:block; margin:16px auto 0; font-size:14px; color:#6B7A6E; text-decoration:underline; text-underline-offset:3px; }
.lock-msg{ text-align:center; font-size:14px; color:var(--pine); font-weight:700; margin-top:14px; }

/* timer */
.timer-wrap{ text-align:center; margin:8px 0 4px; }
.timer{ font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.timer.plus{ color:#B27C2E; }
.timer-hint{ font-size:13px; color:#6B7A6E; }

.blocks{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0 4px; min-height:18px; }
.blocks span{
  width:18px; height:18px; border-radius:5px; background:var(--amber);
  animation:pop .35s ease;
}
@keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion:reduce){ .blocks span{ animation:none; } *{transition:none !important;} }

/* after-session / tsuideni */
.msg-big{ text-align:center; font-size:20px; font-weight:700; margin:28px 0 18px; }
.tsuideni-label{ font-size:13px; color:#6B7A6E; margin-bottom:6px; }

/* ---- Capture ---- */
.cap-lead{ font-size:14px; color:#5C6B5F; margin:10px 2px 10px; }
.cap-status{ font-size:13px; color:var(--pine); font-weight:700; margin-top:10px; text-align:center; }
.pile{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
.pile-item{
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; gap:10px;
}
.pile-item .txt{ flex:1; }
.pile-item .mini{
  font-size:13px; font-weight:700; color:var(--pine);
  border:1.5px solid var(--pine); border-radius:10px; padding:5px 10px; white-space:nowrap;
}
.pile-item .del{ color:#9BAA9C; font-size:13px; }

.decomp{ background:var(--card); border:1.5px solid var(--moss); border-radius:var(--radius-card); padding:20px 18px; margin-top:16px; }
.decomp h3{ font-size:15px; margin-bottom:12px; }
.decomp .q{ font-weight:700; margin-bottom:8px; }
.step-list{ list-style:none; margin:12px 0; display:flex; flex-direction:column; gap:6px; }
.step-list li{ background:var(--paper); border-radius:10px; padding:8px 12px; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sug-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.sug{ text-align:left; background:var(--paper); border:1.5px dashed var(--moss); border-radius:10px; padding:9px 12px; font-size:14px; }
.row2{ display:flex; gap:10px; margin-top:12px; }
.row2 > *{ flex:1; }

details.backstage{ margin-top:34px; }
details.backstage summary{ font-size:13px; color:#6B7A6E; cursor:pointer; }
.proj-box{ background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:14px; }
.proj-box .head{ display:flex; justify-content:space-between; align-items:center; }
.proj-box ul{ list-style:none; margin-top:6px; }
.proj-box li{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; color:#5C6B5F; }
.proj-box .del{ color:#9BAA9C; font-size:12px; }
.del{ padding:10px 12px; white-space:nowrap; border:1.2px solid var(--moss-weak); border-radius:10px; }

/* ---- Done ---- */
.week-line{ text-align:center; margin:22px 0 6px; font-size:18px; }
.week-line b{ font-size:34px; color:var(--pine); }
.done-day{ margin-top:20px; }
.done-day h3{ font-size:13px; color:#6B7A6E; font-weight:500; margin-bottom:8px; }
.done-item{
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px;
  padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; font-size:15px;
}
.done-item .txt{ flex:1; }
.tag{ font-size:12px; font-weight:700; border-radius:8px; padding:3px 8px; white-space:nowrap; }
.tag.touch{ background:var(--amber-soft); color:#8A5F1E; }
.tag.done{ background:#DCE9E1; color:var(--pine); }
.tag.project{ background:var(--pine); color:#fff; }
.done-item .del{ color:#9BAA9C; font-size:12px; }

/* ---- overlay(90分弁) ---- */
.overlay{
  position:fixed; inset:0; background:rgba(38,48,42,.45);
  display:flex; align-items:center; justify-content:center; padding:24px; z-index:30;
}
.overlay .box{ background:var(--card); border-radius:var(--radius-card); padding:26px 22px; max-width:340px; width:100%; max-height:85dvh; overflow:auto; text-align:center; }
.overlay .box p{ margin-bottom:18px; font-weight:700; }

/* ---- nav ---- */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--card); border-top:1.5px solid var(--moss-weak);
  display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;
}
nav.tabs button{
  flex:1; padding:14px 0 12px; font-size:14px; color:#8A988C; font-weight:500;
}
nav.tabs button[aria-current="true"]{ color:var(--pine); font-weight:700; }

.split-editor{border:1px solid var(--moss);border-radius:12px;padding:12px;margin:12px 0;}
.split-chunk{white-space:pre-wrap;overflow-wrap:anywhere;}
.split-boundary{display:block;min-height:44px;width:100%;border:2px dashed var(--moss);border-radius:8px;margin:8px 0;padding:8px;font-size:14px;background:var(--paper);color:var(--pine);}
.split-boundary.is-cut{border:2px solid var(--pine);background:var(--pine);color:white;}
.split-preview{padding-left:24px;margin:12px 0;}.split-preview li{padding:8px;border-bottom:1px solid var(--moss-weak);overflow-wrap:anywhere;}
button:disabled{opacity:.45;cursor:default;}
</style>
</head>
<body>

<header class="app">
  <div class="bar">

  </div>
</header>

<main>
  <section id="view-now" aria-label="Now"></section>
  <section id="view-capture" hidden aria-label="Capture"></section>
  <section id="view-done" hidden aria-label="Done"></section>
</main>

<nav class="tabs" aria-label="Views">
  <button data-v="capture"></button>
  <button data-v="now" aria-current="true"></button>
  <button data-v="done"></button>
</nav>

<div id="storage-status" role="alert" hidden style="position:relative;z-index:1001;background:#fff4df;color:#563f20;padding:12px;max-width:480px;margin:12px auto"></div>
<div id="overlay-root"></div>

<script src="src/storage.js"></script>
<script src="src/draft-ui.js"></script>
<script src="src/prototype.js"></script>
<script src="src/session.js"></script>
<script>

   設計原則:
   - 画面には常に「次の1アクション」だけ
   - 成功の定義は「完了」ではなく「触った」
   - 未完了数・期限切れ・streakは表示しない(実装もしない)
   - 5分経過は停止ではなく通過点(自動でカウントアップ継続)
   - 90分で休憩を提案する安全弁
   多言語: LANGS辞書 + t()。言語はlocalStorageに保存。
   AI分解: claude.ai のartifact環境ではそのまま動作。
   Netlifyなどに置く場合は AI_ENDPOINT を自前のFunction
   (例: /.netlify/functions/decompose) に差し替えること。
===================================================================== */

const LS_KEY = "mazu5_v1";
const FN_ENDPOINT = "/.netlify/functions/decompose";         // 配布形態(Netlify)のAI分解。先に試す

  for(const c of LANG_ORDER){ if(nav.startsWith(c)) return c; }
  return "en";
}

let loadedRevision=0, loadFailed=false, storageConflict=false;
const dirtyDraftKeys=new Set();
let S = load();
function load(){
  try{
    const loaded = MazuStorage.read(localStorage,LS_KEY);
    if(loaded){
      const s = loaded;
      if(!Array.isArray(s.projects)||!Array.isArray(s.done)||!Array.isArray(s.pile))throw Error("invalid saved state");
      loadedRevision=s._revision||0;
      if(!s.lang) s.lang = "ja";
      (s.pile || []).forEach(i => delete i.pending); // 処理中のまま閉じた場合の掃除
      // 旧データ移行(スキーマ版で管理し、重複移行しない)
      if((s.schema || 0) < 17){
        (s.projects || []).forEach(p => {
          if(p.level == null) p.level = 0;
          if(!p.inputId) p.inputId = Math.random().toString(36).slice(2,9);
          if(p.rev == null) p.rev = 0;
          if(!p.denied) p.denied = [];
          if(!p.alt) p.alt = [];
          if(!p.origin) p.origin = [];
          if(!p.legacy) p.legacy = [];   // 由来不明の旧手順を保全する領域
          // v14: queueに複数手順 → 先頭だけを現在の一歩に。残りは legacy へ(nextに入れない)
          if(Array.isArray(p.queue) && p.queue.length > 1){
            p.legacy = p.legacy.concat(p.queue.slice(1));
            p.queue = [p.queue[0]];
          }
          // v16: nextへ移されたが本人由来と確認できないものは legacy へ移す
          if(Array.isArray(p.next) && p.next.length && !p.nextUserSet){
            p.legacy = p.legacy.concat(p.next);
            p.next = [];
          }
          if(!p.next) p.next = [];
        });
        s.schema = 17;
      }
      (s.pile || []).forEach(i => {
        if(i.steps && !i.alt) i.alt = i.steps;  // 旧stepsは判断せずaltとして保持
      });
      return s;
    }
  }catch(e){loadFailed=true;}
  return { projects:[], pile:[], done:[], lastPid:null, lang: detectLang(), hideTimer:false, schema:17 };
}
function save(){
 if(loadFailed){storageFailed=true;renderStorageStatus();return false;}
 const oldRevision=S._revision;
 try{
  const diskState=MazuStorage.read(localStorage,LS_KEY);
  if((diskState?._revision||0)!==loadedRevision){storageConflict=true;storageFailed=true;renderStorageStatus();return false;}
  if(diskState && !diskState.prototypeVersion && !localStorage.getItem(LS_KEY+'_pre_v18_4'))localStorage.setItem(LS_KEY+'_pre_v18_4',localStorage.getItem(LS_KEY));
  for(const g of Object.values(S.splitGroups||{})){g.records=g.records||{};for(const p of S.projects||[])if(g.childIds.includes(p.id))g.records[p.id]=JSON.parse(JSON.stringify(p));}
  S._revision=loadedRevision+1;S.prototypeVersion='18.4';
  const result=MazuStorage.write(localStorage,LS_KEY,S);
  if(!result.ok)throw result.error;
  loadedRevision=S._revision;storageFailed=false;storageConflict=false;dirtyDraftKeys.clear();renderStorageStatus();return true;
 }catch(error){S._revision=oldRevision;storageFailed=true;renderStorageStatus();return false;}
}
function recoverLatestState(){
 try{
  const latest=MazuStorage.read(localStorage,LS_KEY);if(!latest||!Array.isArray(latest.projects))return;
  for(const key of dirtyDraftKeys)MazuStorage.setDraft(latest,key,MazuStorage.getDraft(S,key));
  clearInterval(sess?.tick);S=latest;loadedRevision=latest._revision||0;loadFailed=false;storageConflict=false;
  if(save()){restoreSession();closeDialog();applyLang();render();}
 }catch(error){storageFailed=true;renderStorageStatus();}
}

function localStep(text,p,custom=false){
 if(!text || custom || (p?.lastUserStep===text))return text||"";
 if(PROTOTYPE_TEXT.continue_work.includes(text))return pt('continue_work');
 const langIndex=LANG_ORDER.indexOf(S.lang);
 let offset=0;
 for(const [type,def] of Object.entries(TYPES)){
  for(const chain of [def.chain,...(def.hinted?[def.hinted]:[])]){
   for(let level=0;level<chain.length;level++){
    const template=chain[level], hint=p?.objHint?.trim()||"";
    for(let source=0;source<LANG_ORDER.length;source++){
     const src=source===0?template:STEP_TRANSLATIONS[offset+level][source-1];
     const obj=hint || STEP_OBJECTS[type]?.[source] || def.obj;
     if(src.split('{o}').join(obj)!==text)continue;
     const target=langIndex<=0?template:STEP_TRANSLATIONS[offset+level][langIndex-1];
     return target.split('{o}').join(hint || STEP_OBJECTS[type]?.[Math.max(0,langIndex)] || def.obj);
    }
   }
   offset+=chain.length;
  }
 }
 for(const key of ['nt_sit','nt_stand','nt_breath','nt_look','chg_fallback']){
  if(Object.values(LANGS).some(dict=>dict[key]===text))return t(key);
 }
 return text;
}

const translationJobs = new Map();

 // Only identified AI output is sent for translation; handwritten and unclassified legacy text stays private.

async function translateAction(text,lang){
 const ctl=typeof AbortController!=='undefined'?new AbortController():null;
 const timer=ctl?setTimeout(()=>ctl.abort(),15000):null;
 try{
  const response=await fetch(FN_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'translate',lang,action:text}),signal:ctl?.signal});
  if(!response.ok)return null;
  const data=await response.json();
  return typeof data.translation==='string' && data.translation.trim() && data.translation.length<=500 ? data.translation.trim():null;
 }catch(e){return null;}finally{if(timer)clearTimeout(timer);}
}

function detectType(text){
  const classified=classifyInput(text);if(classified)return classified;
  const t = String(text || "");
  for(const [key, def] of Object.entries(TYPES)){
    if(key === "generic") continue;
    if((def.kw || []).some(k => t.includes(k))) return key;
  }
  return null;
}

/* 課題文から一歩を作る。
   objHint: 「手元に使うものは?」への答え(任意)。答えなくても必ず一歩は返る。 */
/* 現在の行動が、どの型のどの段階かを逆引きする。
   本人が編集した行動など、辞書に無いものは null を返す。 */
function locateStep(stepText, objHint){
  const hint = (objHint && objHint.trim()) ? objHint.trim() : "";
  for(const [key, def] of Object.entries(TYPES)){
    const chains = [def.chain];
    if(def.hinted) chains.push(def.hinted);
    for(const chain of chains){
      for(let i = 0; i < chain.length; i++){
        const obj = hint || def.obj;
        if(chain[i].split("{o}").join(obj) === stepText) return { type: key, level: i, chain, obj };
      }
    }
  }
  return null;
}
/* 現在の行動から見た「一段やさしい準備」。作れなければ null。 */
function smallerThan(stepText, objHint){
  const loc = locateStep(stepText, objHint);
  if(!loc) return null;                       // 辞書外(本人が編集した等) → 当てずっぽうで縮小しない
  if(loc.level + 1 >= loc.chain.length) return null;
  return loc.chain[loc.level + 1].split("{o}").join(loc.obj);
}

function makeStep(text, level, objHint){
  const type = detectType(text) || "generic";
  const def = TYPES[type];
  const hint = (objHint && objHint.trim()) ? objHint.trim() : "";
  // ヒントがあり、型ごとの専用系列がある場合はそちらを使う
  const chain = (hint && def.hinted) ? def.hinted : def.chain;
  const i = Math.min(Math.max(level || 0, 0), chain.length - 1);
  const obj = hint || def.obj;
  return chain[i].split("{o}").join(obj);
}
function maxLevel(text){
  const type = detectType(text) || "generic";
  return TYPES[type].chain.length - 1;
}
/* 型が判定できたか(=一問尋ねる必要があるか) */
function needsHint(text){ return detectType(text) === null; }

/* ---------- 候補選択ロジック ---------- */
function candidates(){
  // 最後に触った課題を最優先で先頭に出す(翌日の再開の中心)
  // ※ urgent(締切7日以内)より後で並べ替えるので、下の return 側で反映

  // queueが空になった課題(次の一歩が未定)は「完了」ではない。
  // 汎用の一歩を補充して候補に残す(本人が明示的に終わらせない限り消さない)。
  S.projects.forEach(p => {
    if(!p.queue || p.queue.length === 0){
      // 本人が編集した行動があればそれを優先し、無い場合だけ辞書から補う
      if(p.lastUserStep){ p.queue = [p.lastUserStep]; }
      else { p.level = 0; p.queue = [makeStep(p.name, 0, p.objHint || "")]; }
    }
  });
  const cands = S.projects.filter(p => p.queue.length > 0);
  const now = Date.now();
  const urgent = cands.filter(p => p.deadline && (new Date(p.deadline) - now) <= URGENT_DAYS*864e5)
                      .sort((a,b) => new Date(a.deadline) - new Date(b.deadline));
  const rest = cands.filter(p => !urgent.includes(p));
  // 前回中断した課題を先頭へ(「続きから」として出す。離れる手段は常に残す)
  const resumeIdx = rest.findIndex(p => p.id === S.lastTouched);
  if(resumeIdx > 0) rest.unshift(rest.splice(resumeIdx, 1)[0]);
  return [...urgent, ...rest];
}

    b.setAttribute("aria-current", b.dataset.v === v ? "true" : "false"));
  ["now","capture","done"].forEach(x =>
    document.getElementById("view-"+x).hidden = (x !== v));
  render();
}

/* 課題を預かる唯一の入口。「いま」も「書き出す」もここを通る。
   入力直後に原文と辞書の一歩で保存し、候補にする(AIを待たない)。 */
function entrust(text, opts){
  opts = opts || {};
  const p = {
    id: uid(),
    inputId: uid(),          // AI応答との対応付け用(順番やタイトルに依存しない)
    name: text,              // 原文。AIの要約タイトルで上書きしない
    aiTitle: "",             // AIが付けた短い名前(表示の補助にのみ使う)
    deadline: null,
    level: 0,
    objHint: "",
    denied: [],              // 「ない」と言われた対象の記録
    rev: 0,                  // 変更番号。古いAI応答を無効化する
    queue: [makeStep(text, 0, "")],
    alt: [], next: [], origin: [], resumeNote: ""
  };
  S.projects.push(p);
  sourceInit();
  if(!opts.deferSave)save();
  if(!opts.noHint && needsHint(text)) ui.hintFor = p.id;
  if(!opts.silent) renderNow();
  return p;
}

/* AIは保存済みの課題を後から補強するだけ。失敗しても課題は消えない。 */
async function aiEnrich(projs){
 const actionLang=S.lang;
 const token=uid();projs=projs.filter(p=>S.projects.includes(p));
 const sent=projs.map(p=>({p,id:p.id,rev:p.rev,token}));
 projs.forEach(p=>{p.splitToken=token;p.splitStatus='checking';});save();
 const items=await callAI(projs.map(p=>({id:p.id,text:p.name})));
 for(const request of sent){
  const p=S.projects.find(x=>x.id===request.id);
  if(!p||p.splitToken!==token)continue;
  const it=items?.find(x=>x.id===request.id);
  const cuts=it?splitCuts(p.name,it.parts):null;
  const pristine=p.rev===request.rev&&!p.userEdited&&!p.groupId&&!(sess&&sess.pid===p.id);
  if(cuts){
   if(pristine){applySplit(p,cuts);continue;}
   p.splitProposal={cuts};p.splitStatus='proposal';
  }else p.splitStatus=it?.parts?.length===1&&it.parts[0].trim()===p.name.trim()?'checked':'offline';
  // A multi-part response with invalid boundaries must not assign a partial action to the whole input.
  if(pristine && it && !(it.parts?.length>1)){
   if(it.first&&!isDenied(p,it.first))p.queue=[it.first];
   p.generatedActions=[...new Set([...(p.generatedActions||[]),it.first,...(it.smaller||[])].filter(Boolean))];
   S.actionTranslations=S.actionTranslations||[];
   for(const text of [it.first,...(it.smaller||[])].filter(Boolean)){
    if(!S.actionTranslations.some(x=>x.source===text && x.lang===actionLang))S.actionTranslations.push({source:text,lang:actionLang,text});
   }
   p.alt=(it.smaller||[]).filter(x=>!isDenied(p,x));
   if(it.deadline)p.deadline=it.deadline;
  }
 }
 save();renderCurrent();
}

function renderCurrent(){
  if(ui.view === "capture" && !ui.decompId){ const draft=document.getElementById("cap-text")?.value||"";if(draft)return;renderCapture();}
  else if(ui.view === "now" && !sess) renderNow();
}

/* 否定された対象を含む候補かどうか */
function isDenied(p, textStr){
  if(!p.denied || !p.denied.length) return false;
  return p.denied.some(d => d && String(textStr).includes(d));
}

/* 道具を必要としない入口(対象を否定された場合や、代案が尽きたときに使う) */
const NO_TOOL_STEPS = ["nt_sit", "nt_stand", "nt_breath", "nt_look"];

/* 入力不要の代案メニュー。否定された対象は候補から除く。 */
function openChangeMenu(p){
  const cur = p.queue[0];
  const root = dialog(`<p style="font-weight:500">${t("chg_title")}</p>
    <button class="btn-main" id="chg-alt">${t("chg_alt")}</button>
    <button class="btn-sub" id="chg-nothave">${t("chg_nothave")}</button>
    <button class="btn-sub" id="chg-write">${t("chg_write")}</button>
    <button class="btn-sub" id="chg-rest">${t("chg_rest")}</button>
    <button class="btn-line" id="chg-cancel">${t("dec_cancel")}</button>`);

  root.querySelector("#chg-alt").onclick = () => {
    closeDialog();
    const pool = [];
    (p.alt || []).forEach(x => pool.push(x));
    for(let lv = 0; lv <= maxLevel(p.name); lv++) pool.push(makeStep(p.name, lv, p.objHint || ""));
    NO_TOOL_STEPS.forEach(k => pool.push(t(k)));   // 道具に依存しない入口も候補にする
    p.tried = p.tried || [];
    // 否定された対象を含む候補と、既に試した候補は出さない
    const recent = [cur].concat(p.origin || []);   // 直前まで見ていた行動は出さない
    const cand = pool.find(x => x && !recent.includes(x) && !p.tried.includes(x) && !isDenied(p, x));
    if(cand){
      p.tried.push(cur);
      p.queue[0] = cand;
      p.origin = [];                 // 別の行動へ移るので復帰履歴は混用しない
      p.level = 0;
      p.rev = (p.rev || 0) + 1;
      save(); renderNow();
    } else {
      showNotice(t("chg_none"));
    }
  };

  root.querySelector("#chg-nothave").onclick = () => {
    closeDialog();
    // 何を否定したかを記録する(単一フラグにしない)
    p.denied = p.denied || [];
    const obj = guessObject(p, cur);
    if(obj && !p.denied.includes(obj)) p.denied.push(obj);
    p.objHint = "";
    p.tried = p.tried || [];
    if(cur) p.tried.push(cur);
    // 否定した対象に依存しない候補を、道具を使わない入口から順に探す
    const pool = [];
    for(let lv = maxLevel(p.name); lv >= 0; lv--) pool.push(makeStep(p.name, lv, ""));
    (p.alt || []).forEach(x => pool.push(x));
    NO_TOOL_STEPS.forEach(k => pool.push(t(k)));   // 道具に依存しない入口(複数)
    const cand = pool.find(x => x && !isDenied(p, x) && x !== cur && !(p.tried||[]).includes(x));
    p.queue[0] = cand || t("chg_fallback");
    p.origin = [];
    p.level = 0;
    p.rev = (p.rev || 0) + 1;
    save(); renderNow();
  };

  root.querySelector("#chg-write").onclick = () => {
    closeDialog();
    const r2 = dialog(`<p style="font-weight:500">${t("chg_write")}</p>
      <input type="text" id="dlg-step" value="${esc(localStep(cur,p))}">
      <button class="btn-main" id="dlg-ok" style="margin-top:12px">OK</button>
      <button class="btn-sub" id="dlg-cancel">${t("dec_cancel")}</button>`);
    r2.querySelector("#dlg-ok").onclick = () => {
      const v = r2.querySelector("#dlg-step").value.trim();
      closeDialog();
      if(v){
        p.queue[0] = v;
        p.userEdited = true;
        p.lastUserStep = v;
        p.origin = [];               // 別の行動になったので復帰履歴を混用しない
        p.level = 0;
        p.rev = (p.rev || 0) + 1;
        save(); renderNow();
      }
    };
    r2.querySelector("#dlg-cancel").onclick = closeDialog;
  };

  root.querySelector("#chg-rest").onclick = () => { closeDialog(); showNotice(t("chg_rest_msg")); };
  root.querySelector("#chg-cancel").onclick = closeDialog;
}

/* 現在の行動が前提にしている対象を推定する(否定の記録用) */
function guessObject(p, stepText){
  if(p.objHint && p.objHint.trim()) return p.objHint.trim();
  const loc = locateStep(stepText, p.objHint || "");
  if(loc && loc.obj) return loc.obj;
  const known = ["教材", "書類", "着替え", "スマホ", "アプリ"];
  return known.find(k => String(stepText).includes(k)) || "";
}

/* もっと小さく: いま表示されている行動を基準に、必要な準備へ戻す */
function shrinkStep(p){
  const cur = p.queue[0];
  let next = smallerThan(cur, p.objHint || "");
  // 否定された対象を含む候補は使わない
  if(next && isDenied(p, next)) next = null;
  if(!next){
    // 適切に縮小できない場合は、元の行動を保ったまま代案メニューを出す
    openChangeMenu(p);
    return;
  }
  p.origin = p.origin || [];
  p.origin.push(cur);              // どの行動の準備かを保持
  p.queue[0] = next;
  p.level = (p.level || 0) + 1;
  p.rev = (p.rev || 0) + 1;        // 遅延AI応答を無効化
  save();
  renderNow();
}

/* やわらかいチャイム */
function chime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const tt = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.12, tt + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.6);
      o.start(tt); o.stop(tt + 0.7);
    });
  }catch(e){}
}

/* =====================================================================
   AIパイプライン
   書き殴り → 切り分け → 各タスクの5分行動 → 空きがあれば自動でプロジェクト化
   失敗したら何も起こらず、改行分割の結果と手動分解にそのまま落ちる
===================================================================== */
/* AI呼び出し共通部: Netlify Function優先、artifact環境の直接呼び出しにフォールバック */
async function callAI(tasks){
  const today = new Date().toISOString().slice(0,10);
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : null;  // 通信の時間制限
  try{
    const r = await fetch(FN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tasks, lang: L().aiLang, today }),
      signal: ctl ? ctl.signal : undefined
    });
    if(r.ok){
      const d = await r.json();
      const items = sanitizeItems(d.items);
      if(timer) clearTimeout(timer);
      if(items) return items;
    }
  }catch(e){}
  if(timer) clearTimeout(timer);
  const directCtl = typeof AbortController!=="undefined" ? new AbortController() : null;
  const directTimer = directCtl ? setTimeout(()=>directCtl.abort(),15000) : null;
  try{
    const res = await fetch(AI_ENDPOINT, {
      signal: directCtl ? directCtl.signal : undefined,
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: buildPrompt(tasks, L().aiLang, today) }]
      })
    });
    const data = await res.json();
    const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    return sanitizeItems(JSON.parse(text.replace(/```json|```/g, "").trim()));
  }catch(e){}finally{ if(directTimer)clearTimeout(directTimer); }
  return null;
}
function sanitizeItems(items){
  if(!Array.isArray(items)) return null;
  // 行動として不適切なもの(数量の捏造・計画動詞)
  const BAD_ACTION = [/\d+\s*(個|枚|冊|本|ページ|字|文字|語|分|時間|件|箱)/,
                      /\b\d+\s*(pages?|words?|items?|boxes?|minutes?|hours?)\b/i,
                      /(計画を立て|整理する|検討する|決める|考える|見直す|まとめる)/,
                      /\b(plan out|organize|decide|think about|review|summarize)\b/i];
  // 課題名は名前。「旅行の計画」等を拒否しない(数量の捏造だけ見る)
  const BAD_TITLE = [/\d+\s*(個|枚|冊|本|ページ|字|文字|語|箱)/,
                     /\b\d+\s*(pages?|words?|items?|boxes?)\b/i];
  const bad = (x, rules) => rules.some(re => re.test(String(x)));

  const used = new Set();
  const out = [];
  for(const it of items){
    if(!it || typeof it !== "object") continue;
    const id = String(it.id || "");
    if(id && used.has(id)) continue;          // 重複IDは最初だけ
    let first = typeof it.first === "string" ? it.first.trim() : "";
    let smaller = Array.isArray(it.smaller) ? it.smaller.map(String) : [];
    if(!first && Array.isArray(it.steps) && it.steps.length){   // 旧形式も読む
      first = String(it.steps[0]); smaller = it.steps.slice(1).map(String);
    }
    const title = typeof it.title === "string" ? it.title.trim() : "";
    const okFirst = first && !bad(first, BAD_ACTION);
    const okTitle = title && !bad(title, BAD_TITLE);
    if(!okFirst && !okTitle && !Array.isArray(it.parts)) continue;         // 行動も名前も使えない場合だけ捨てる
    if(id) used.add(id);
    out.push({
      id,
      parts: Array.isArray(it.parts) ? it.parts.filter(x=>typeof x === "string").slice(0,20) : [],
      title: okTitle ? title.slice(0, 40) : "",
      deadline: /^\d{4}-\d{2}-\d{2}$/.test(it.deadline || "") ? it.deadline : null,
      first: okFirst ? first.slice(0, 120) : "",
      smaller: smaller.map(x => x.trim()).filter(x => x && !bad(x, BAD_ACTION)).slice(0, 3)
    });
  }
  return out.length ? out : null;
}
function buildPrompt(tasks, lang, today){
  const list = tasks.map(t => typeof t === "string"
    ? `- id=(none) : ${t}` : `- id=${t.id} : ${t.text}`).join("\n");
  return `You help someone with ADHD take the very first physical step on a task. They freeze before big tasks.

Tasks (each has an id — echo the SAME id back):
${list}


Also return "parts": exact, verbatim substrings of this input for INDEPENDENT tasks, in source order. Use [the full original text] if it is one task or ambiguous. Do not split merely at commas. "資料を読んで、レポートを書く" is one task; "資格の勉強、引っ越しの準備" and "資格の勉強、宿題" are two independent tasks each. Only whitespace or punctuation may be left between parts; never omit clauses. No paraphrasing in parts. Echo the input id ONCE with all parts in the same result.

For each task return:
- "id": the exact id given above
- "title": short name, max 20 chars, same language as the task
- "deadline": YYYY-MM-DD only if explicitly written (today is ${today}); otherwise null
- "first": ONE action to start with, written in ${lang}
- "smaller": 2 fallback actions in ${lang}, EACH EASIER than "first".
  These are NOT later steps. They are what to do instead when "first" feels too hard.
  Example: "open the reply screen" -> "open the messaging app" -> "pick up the phone".

CRITICAL: only "open / pick up / look at / stand up" level acts. Never assume what the person owns.
Never invent quantities, page numbers, word counts, item counts, or durations.
No planning/deciding/organizing verbs in the ACTIONS (task names may contain such words; that is fine).

Reply ONLY with a JSON array:
[{"id":"...","title":"...","deadline":null,"first":"...","smaller":["...","..."],"parts":["exact original task text"]}]`;
}

/* 手動フロー内のAIは「提案」を出すだけ。採用するかは本人が選ぶ */
async function aiDecompose(item, btn){
  btn.textContent = t("ai_busy"); btn.disabled = true;
  const items = await callAI([item.text]);
  if(items){
    ui.decompSuggests = items.flatMap(it => [it.first].concat(it.smaller || [])).filter(Boolean);
    renderDecomp();
    return;
  }
  btn.textContent = t("ai_fail");
  btn.disabled = true;
}

document.addEventListener("click", e => {
  const btn = e.target && e.target.closest ? e.target.closest("[data-cmd]") : null;
  if(!btn) return;
  const cmd = btn.dataset.cmd;
  if(cmd === "proj-del"){
    const p = S.projects.find(x => x.id === btn.dataset.id);
    if(!p) return;
    showConfirm(t("del_confirm",{t:p.name}), () => {
      S.projects = S.projects.filter(x => x.id !== p.id);
      save(); renderCapture();
    });
    return;
  }
  if(cmd === "step-del"){
    const p = S.projects.find(x => x.id === btn.dataset.pid);
    if(!p) return;
    p.queue.splice(+btn.dataset.i, 1);
    save(); renderCapture(); return;
  }
  if(cmd === "done-del"){
    S.done = S.done.filter(d => d.ts !== +btn.dataset.ts);
    save(); renderDone(); return;
  }
});

const SPLIT_TEXT={
 split:['課題を分ける','Separate tasks','काम अलग करें','할 일 나누기','拆分任务','Separar tareas','Séparer les tâches'],
 help:['別々の課題だけを分けます。一つの課題の手順なら、そのままで大丈夫。','Separate independent tasks, not steps of one task.','अलग काम बाँटें, एक काम के चरण नहीं।','한 일의 단계가 아닌 별개의 일을 나눠요.','只拆分独立任务，不拆分同一任务的步骤。','Separa tareas independientes, no pasos de una tarea.','Séparez les tâches indépendantes, pas les étapes d’une tâche.'],
 place:['原文の分けたい位置をクリックし、区切りを追加してください。書き直す必要はありません。','Click a boundary in the original text, then add a break. No rewriting needed.','मूल पाठ में जगह चुनकर विभाजन जोड़ें। दोबारा लिखना ज़रूरी नहीं।','원문에서 나눌 위치를 누르고 구분을 추가하세요. 다시 쓰지 않아도 돼요.','点击原文中要分开的位置，再添加分隔，无需重写。','Haz clic donde separar el texto y añade un corte. No necesitas reescribir.','Cliquez à l’endroit voulu dans le texte puis ajoutez une séparation, sans réécrire.'],
 add:['ここで区切る','Add break here','यहाँ अलग करें','여기서 나누기','在此分开','Separar aquí','Séparer ici'],
 clear:['区切りを消す','Clear breaks','विभाजन हटाएँ','구분 지우기','清除分隔','Quitar cortes','Effacer les séparations'],
 apply:['この分け方で保存','Save these tasks','इस तरह सहेजें','이렇게 저장','保存拆分','Guardar estas tareas','Enregistrer ces tâches'],
 cancel:['戻る','Back','वापस','돌아가기','返回','Volver','Retour'],
 invalid:['分けたい位置を選んでください。各課題に文字が必要です。','Choose a boundary. Each task needs some text.','जगह चुनें। हर काम में पाठ होना चाहिए।','나눌 위치를 선택하세요. 각 일에 글자가 필요해요.','请选择分隔位置，每项任务都需要文字。','Elige un corte. Cada tarea necesita texto.','Choisissez une séparation. Chaque tâche doit contenir du texte.'],
 merge:['分ける前にまとめ直す','Merge back','फिर एक साथ करें','다시 합치기','重新合并','Volver a unir','Regrouper'],
 merged:['元の入力にまとめました。分割後の内容は「分けた課題の保存内容」で確認できます。','Merged. Child task details are kept in Saved split tasks.','एक साथ किया। अलग कामों की जानकारी सहेजी गई है।','합쳤어요. 나눈 일의 내용은 보관되어 있어요.','已合并，子任务内容保留在已保存的拆分任务中。','Unido. Los detalles separados siguen guardados.','Regroupé. Les détails des tâches séparées sont conservés.'],
 archive:['分けた課題の保存内容','Saved split tasks','अलग कामों की जानकारी','나눈 일의 저장 내용','已保存的拆分任务','Tareas separadas guardadas','Tâches séparées conservées'],
 restore:['保存した分け方に戻す','Restore saved split','सहेजा विभाजन लौटाएँ','저장한 구분 복원','恢复已保存的拆分','Restaurar separación','Rétablir la séparation'],
 offline:['自動の切り分けを確認できませんでした。入力は保存済みです。複数なら「課題を分ける」で区切れます。','Automatic splitting was unavailable. Your input is saved; use Separate tasks if needed.','अपने आप विभाजन नहीं हो सका। पाठ सहेजा है; ज़रूरत हो तो काम अलग करें।','자동 구분을 확인하지 못했어요. 입력은 저장됐고 직접 나눌 수 있어요.','自动拆分不可用，输入已保存，可使用拆分任务。','No se pudo separar automáticamente. El texto está guardado; puedes separar tareas.','Séparation automatique indisponible. Le texte est conservé ; vous pouvez séparer les tâches.'],
 proposal:['分け方の提案があります。操作済みの課題は変更していません。','A split suggestion is ready. Your changes were kept.','विभाजन सुझाव तैयार है। आपके बदलाव सुरक्षित हैं।','구분 제안이 있어요. 기존 조작은 유지했어요.','已有拆分建议，未更改你的操作。','Hay una propuesta de separación. Tus cambios se conservan.','Une séparation est proposée. Vos modifications sont conservées.'],
 notice:['課題を分けました。分け方は各課題から戻せます。','Tasks separated. You can merge them back.','काम अलग हुए। फिर मिला सकते हैं।','일을 나눴어요. 다시 합칠 수 있어요.','任务已拆分，可重新合并。','Tareas separadas. Puedes volver a unirlas.','Tâches séparées. Vous pouvez les regrouper.'],
 lead:['思いつくまま書いて大丈夫。改行で分けても構いません。分け方はあとから直せます。','Write freely, with or without line breaks. You can adjust the split later.','जैसा मन में आए लिखें। पंक्तियाँ अलग कर सकते हैं। विभाजन बाद में बदल सकते हैं।','자유롭게 적으세요. 줄을 나눠도 돼요. 구분은 나중에 바꿀 수 있어요.','随意写下来，也可以换行，之后可调整拆分。','Escribe libremente, con o sin saltos de línea. Puedes ajustar la separación después.','Écrivez librement, avec ou sans retours à la ligne. Vous pourrez ajuster la séparation.']
};
Object.assign(SPLIT_TEXT,{"tap": ["分けたい場所のボタンを押してください。もう一度押すとつながります。", "Tap a boundary to split. Tap again to join.", "अलग करने की जगह का बटन दबाएँ। फिर दबाने से जुड़ता है।", "나눌 곳의 버튼을 누르세요. 다시 누르면 합쳐져요.", "点击分隔按钮，再次点击即可连接。", "Pulsa donde separar. Pulsa de nuevo para unir.", "Appuyez pour séparer. Appuyez à nouveau pour relier."], "join": ["ここをつなげる", "Join here", "यहाँ जोड़ें", "여기 잇기", "在此连接", "Unir aquí", "Relier ici"], "fine": ["ほかの位置で分ける", "Choose another position", "दूसरी जगह चुनें", "다른 위치에서 나누기", "选择其他位置", "Elegir otra posición", "Choisir un autre endroit"], "simple": ["区切り候補に戻る", "Show suggested positions", "सुझाई जगह दिखाएँ", "추천 위치로 돌아가기", "返回建议位置", "Ver posiciones sugeridas", "Voir les positions proposées"], "preview": ["保存すると、この課題に分かれます", "Tasks after saving", "सहेजने के बाद के काम", "저장하면 이렇게 나뉘어요", "保存后的任务", "Tareas al guardar", "Tâches après enregistrement"]});
function st(key){return SPLIT_TEXT[key][Math.max(0,LANG_ORDER.indexOf(S.lang))];}
function sourceInit(){
 S.dataEpoch=S.dataEpoch||uid();
 S.inputs=S.inputs||{};S.splitGroups=S.splitGroups||{};
 for(const p of S.projects){p.inputId=p.inputId||uid();if(!S.inputs[p.inputId])S.inputs[p.inputId]={id:p.inputId,text:p.name};p.sourceText=p.sourceText||S.inputs[p.inputId].text;}
}
// Exact substring matching rejects omitted clauses, reordered content and invented titles.
function splitCuts(text, parts){
 if(!Array.isArray(parts)||parts.length<2||parts.length>20)return null;
 let at=0;const cuts=[];
 for(let i=0;i<parts.length;i++){
  if(typeof parts[i]!== 'string'||!parts[i].trim())return null;
  const part=parts[i].trim(),pos=text.indexOf(part,at);
  if(pos<0||!/^[\s、,;；。]*$/.test(text.slice(at,pos)))return null;
  if(i)cuts.push(pos);at=pos+part.length;
 }
 return /^[\s、,;；。]*$/.test(text.slice(at))?cuts:null;
}
function cutSegments(text,cuts){
 const sorted=[...new Set(cuts)].sort((a,b)=>a-b);
 if(sorted.some(x=>!Number.isInteger(x)||x<=0||x>=text.length||(/[\uD800-\uDBFF]/.test(text[x-1])&&/[\uDC00-\uDFFF]/.test(text[x]))))return null;
 const bounds=[0,...sorted,text.length],out=[];
 for(let i=1;i<bounds.length;i++){const raw=text.slice(bounds[i-1],bounds[i]);const name=raw.replace(/^[\s、,;；。]+|[\s、,;；。]+$/g,'');if(!name)return null;out.push({name,raw,start:bounds[i-1],end:bounds[i]});}
 return out;
}
function applySplit(p,cuts){
 if(!S.projects.includes(p)||sess?.phase==='run')return false;
 const chunks=cutSegments(p.name,cuts);if(!chunks||chunks.length<2)return false;
 sourceInit();
 const existing=p.groupId&&S.splitGroups[p.groupId]?.active?S.splitGroups[p.groupId]:null;
 const groupId=existing?existing.id:uid(),children=chunks.map(c=>({...JSON.parse(JSON.stringify(p)),id:uid(),name:c.name,sourceText:p.sourceText||p.name,
  groupId,span:[c.start,c.end],queue:[makeStep(c.name,0,'')],next:[],alt:[],origin:[],level:0,objHint:'',rev:0,
  resumeNote:'',userEdited:false,lastUserStep:'',splitProposal:null,splitStatus:'split',splitToken:null}));
 if(existing){existing.records=existing.records||{};existing.records[p.id]=JSON.parse(JSON.stringify(p));existing.childIds.splice(existing.childIds.indexOf(p.id),1,...children.map(x=>x.id));}
 else S.splitGroups[groupId]={id:groupId,parent:JSON.parse(JSON.stringify(p)),childIds:children.map(x=>x.id),active:true,snapshots:[],records:{}};
 S.projects.splice(S.projects.indexOf(p),1,...children);if(S.lastTouched===p.id)S.lastTouched=children[0].id;
 ui.hintFor=null;ui.skip=Math.max(0,candidates().findIndex(x=>x.id===children[0].id));ui.capMsg=st('notice');save();renderCurrent();return true;
}
function mergeGroup(groupId){
 const g=S.splitGroups[groupId];if(!g||!g.active||sess?.phase==='run')return;
 const members=S.projects.filter(x=>g.childIds.includes(x.id));if(!members.length)return;
 g.snapshots=JSON.parse(JSON.stringify(members));g.resumeChild=members.some(p=>p.id===S.lastTouched)?S.lastTouched:null;
 const parent={...JSON.parse(JSON.stringify(g.parent)),rev:(g.parent.rev||0)+1,splitStatus:'merged',splitProposal:null,mergedGroup:groupId};
 // Keep the original task's edits; child edits and notes remain individually restorable.
 S.projects=S.projects.filter(x=>!g.childIds.includes(x.id));S.projects.push(parent);g.active=false;
 if(g.childIds.includes(S.lastTouched))S.lastTouched=parent.id;
 ui.capMsg=st('merged');ui.skip=0;save();closeDialog();renderCurrent();
}
function restoreGroup(p){
 const g=S.splitGroups[p.mergedGroup];if(!g||g.active||!S.projects.includes(p))return;
 g.parent=JSON.parse(JSON.stringify(p));delete g.parent.mergedGroup;
 S.projects.splice(S.projects.indexOf(p),1,...JSON.parse(JSON.stringify(g.snapshots)));g.active=true;
 if(S.lastTouched===p.id)S.lastTouched=g.snapshots.some(x=>x.id===g.resumeChild)?g.resumeChild:g.snapshots[0]?.id;
 ui.skip=0;save();closeDialog();renderCurrent();
}
function boundaryPoints(text,fine){
 const points=[];
 if(!fine){for(const m of text.matchAll(/[、,;；。\n]+\s*/g)){const pos=m.index+m[0].length;if(pos<text.length)points.push(pos);}}
 if(fine||!points.length){
  if(typeof Intl.Segmenter==='function'){for(const part of new Intl.Segmenter(S.lang,{granularity:fine?'grapheme':'word'}).segment(text)){if(part.index>0)points.push(part.index);}}
  else {let pos=0;for(const c of Array.from(text)){pos+=c.length;if(pos<text.length)points.push(pos);}}
 }
 return [...new Set(points)].filter(pos=>!!cutSegments(text,[pos]));
}
function splitDialog(p){
 if(!p)return;
 p.rev=(p.rev||0)+1;save(); // Protect an open manual split editor from late AI replacement.
 const suggestion=p.splitProposal?.cuts?.slice()||offlineSplitCuts(p.name);
 let cuts=suggestion||[];let fine=false;
 const draw=()=>{
  const preview=cutSegments(p.name,cuts);
  const points=[...new Set([...boundaryPoints(p.name,fine),...cuts])].sort((a,b)=>a-b);
  const all=[0,...points,p.name.length];
  const editor=all.slice(1).map((end,i)=>`<span class="split-chunk">${esc(p.name.slice(all[i],end))}</span>${end<p.name.length?`<button type="button" class="split-boundary ${cuts.includes(end)?'is-cut':''}" id="boundary-${end}" aria-pressed="${cuts.includes(end)}" aria-label="${esc(st(cuts.includes(end)?'join':'add')+' · '+p.name.slice(end,end+20))}">${st(cuts.includes(end)?'join':'add')}</button>`:''}`).join('');
  const root=dialog(`<h3>${st('split')}</h3><details ${suggestion?'':'open'}><summary>${pt('split_edit')}</summary><p>${st('help')}</p><p>${st('tap')}</p><div class="split-editor">${editor}</div><button class="btn-line" id="split-fine">${st(fine?'simple':'fine')}</button><button class="btn-line" id="split-clear">${st('clear')}</button></details><p>${st('preview')}</p><ol class="split-preview">${(preview||[]).map(x=>`<li>${esc(x.name)}</li>`).join('')}</ol><p role="status" id="split-error"></p><button class="btn-main" id="split-save" ${cuts.length?'':'disabled'}>${st('apply')}</button>${p.groupId&&S.splitGroups[p.groupId]?.active?`<button class="btn-sub" id="split-merge">${st('merge')}</button>`:''}${p.mergedGroup?`<button class="btn-sub" id="split-history">${st('archive')}</button>`:''}<button class="btn-line" id="split-cancel">${st('cancel')}</button>`);
  for(const pos of points)root.querySelector('#boundary-'+pos).onclick=()=>{const next=cuts.includes(pos)?cuts.filter(x=>x!==pos):[...cuts,pos];if(!cutSegments(p.name,next)){root.querySelector('#split-error').textContent=st('invalid');return;}cuts=next;draw();};
  root.querySelector('#split-fine').onclick=()=>{fine=!fine;draw();};
  root.querySelector('#split-clear').onclick=()=>{cuts=[];draw();};
  root.querySelector('#split-save').onclick=()=>{if(!cuts.length){root.querySelector('#split-error').textContent=st('invalid');return;}closeDialog();applySplit(p,cuts);};
  root.querySelector('#split-cancel').onclick=closeDialog;
  const merge=root.querySelector('#split-merge');if(merge)merge.onclick=()=>mergeGroup(p.groupId);
  const history=root.querySelector('#split-history');if(history)history.onclick=()=>{
   const g=S.splitGroups[p.mergedGroup];const r=dialog(`<h3>${st('archive')}</h3>${Object.values(g.records||{}).map(x=>`<p><b>${esc(x.name)}</b><br>${esc(x.queue.map(q=>localStep(q,x)).join(' / '))}<br>${esc(x.resumeNote||'')}</p>`).join('')}<button class="btn-main" id="split-restore">${st('restore')}</button><button class="btn-line" id="split-close">${st('cancel')}</button>`);
   r.querySelector('#split-restore').onclick=()=>restoreGroup(p);r.querySelector('#split-close').onclick=closeDialog;
  };
 };draw();
}

// Legacy AI actions have no provenance field. Only untouched v17+ automatic projects
// (inputId present, no user edits) can be conservatively migrated.
for(const p of S.projects){
 if(p.inputId && !p.userEdited && !p.generatedActions)p.generatedActions=[...(p.queue||[]),...(p.alt||[])];
}
sourceInit();
const WELCOME_FLOW=["課題を預ける → 一歩を選ぶ → 途中でやめても記録に残ります。時間は決めなくても大丈夫。", "Set down a task → choose a step → stopping still counts. You do not need to set a timer.", "काम रखें → एक कदम चुनें → बीच में रुकना भी दर्ज होता है। समय तय करना ज़रूरी नहीं।", "일 맡기기 → 한 걸음 선택 → 중간에 멈춰도 기록돼요. 시간을 정하지 않아도 돼요.", "放下任务 → 选一步 → 中途停下也会记录。不必设定时间。", "Deja una tarea → elige un paso → parar también cuenta. No necesitas fijar un tiempo.", "Déposez une tâche → choisissez un pas → vous pouvez arrêter et garder une trace. Le minuteur est facultatif."];
for(const [i,lang] of LANG_ORDER.entries()){LANGS[lang].wel_flow=WELCOME_FLOW[i];LANGS[lang].wel_body=SPLIT_TEXT.lead[i];}
for(const lang of LANG_ORDER){const i=LANG_ORDER.indexOf(lang);LANGS[lang].cap_lead=SPLIT_TEXT.lead[i];}
applyPrototypeLanguage();
for(const p of S.projects){if(p.splitStatus==='checking')p.splitStatus='offline';}
save();
ui.minutes=S.minutes||5;
restoreSession();
ui.hideTimer = !!S.hideTimer;   // 時間非表示の設定を復元
applyLang();
switchView("now");
if(!S.welcomed) showWelcome();
</script>
