<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まず5分">
<title>まず5分</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"まず5分","short_name":"まず5分","start_url":".","display":"standalone","background_color":"%23EDF0EB","theme_color":"%23EDF0EB"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---- tokens ----
   paper  #EDF0EB  背景(淡い灰緑)
   card   #FBFCFA  カード
   ink    #26302A  文字
   pine   #33695B  主アクション
   moss   #B4C4B4  枠・弱い文字
   amber  #DFA95C  積み上げブロック
------------------------- */
:root{
  --paper:#EDF0EB; --card:#FBFCFA; --ink:#26302A; --pine:#33695B;
  --moss:#B4C4B4; --moss-weak:#D7E0D6; --amber:#DFA95C; --amber-soft:#F3E2C6;
  --radius-card:20px; --radius-btn:14px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans", sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.7;
  min-height:100dvh; display:flex; flex-direction:column;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:3px solid var(--pine); outline-offset:2px; border-radius:6px;
}
input[type=text], input[type=date], textarea{
  font:inherit; width:100%; background:var(--card);
  border:1.5px solid var(--moss); border-radius:12px; padding:12px 14px; color:var(--ink);
}
textarea{resize:vertical; min-height:96px;}
input[type=date]{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; min-width:0; max-width:100%;
  min-height:49px; text-align:left;
}
input[type=date]::-webkit-date-and-time-value{ text-align:left; margin:0; }
.now-line{ text-align:center; font-size:14px; color:#5C6B5F; margin:6px 0 14px; min-height:1.4em; }
::placeholder{color:#9BAA9C;}
input, textarea{ -webkit-user-select:text; user-select:text; }

header.app{ padding:calc(env(safe-area-inset-top) + 14px) 20px 6px; }
header.app .bar{ position:relative; display:flex; align-items:center; justify-content:center; max-width:430px; margin:0 auto; }
header.app .t{ font-weight:700; font-size:15px; letter-spacing:.2em; color:var(--pine); }
#lang-sel{
  position:absolute; right:0; font:inherit; font-size:13px; color:#5C6B5F;
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:999px;
  padding:4px 10px; -webkit-appearance:none; appearance:none;
}
#help-btn{
  position:absolute; left:0; width:30px; height:30px; border-radius:999px;
  border:1.5px solid var(--moss-weak); background:var(--card);
  color:#5C6B5F; font-weight:700; font-size:15px; line-height:1;
}
.wel-langs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.wel-langs button{
  font-size:12px; padding:4px 10px; border:1.5px solid var(--moss-weak);
  border-radius:999px; color:#5C6B5F; background:var(--card);
}
.wel-langs button[aria-pressed="true"]{ background:var(--pine); border-color:var(--pine); color:#fff; font-weight:700; }

main{ flex:1; width:100%; max-width:430px; margin:0 auto; padding:8px 18px 110px; }
section[hidden]{display:none;}

/* ---- Now ---- */
.now-empty{ text-align:center; padding:56px 8px; }
.now-empty p{ margin-bottom:20px; color:#5C6B5F; }

.card{
  background:var(--card); border-radius:var(--radius-card);
  border:1.5px solid var(--moss-weak);
  box-shadow:0 2px 0 var(--moss-weak);
  padding:26px 22px; transition:background .8s ease;
}
.card.overtime{ background:var(--amber-soft); border-color:var(--amber); }

.proj-name{ font-size:13px; color:#6B7A6E; margin-bottom:6px; }
.action-text{ font-size:24px; font-weight:700; line-height:1.5; }
.resume-note{
  margin-top:14px; font-size:14px; color:#5C6B5F;
  background:var(--paper); border-radius:10px; padding:10px 12px;
}
.resume-note b{ color:var(--pine); font-weight:700; }

.minute-row{ display:flex; gap:10px; margin:22px 0 14px; }
.chip{
  flex:1; padding:10px 0; text-align:center; font-weight:500;
  border:1.5px solid var(--moss); border-radius:var(--radius-btn); background:var(--card);
}
.chip[aria-pressed="true"]{ background:var(--pine); border-color:var(--pine); color:#fff; font-weight:700; }

.btn-main{
  display:block; width:100%; padding:16px 0; text-align:center;
  background:var(--pine); color:#fff; font-size:18px; font-weight:700;
  border-radius:var(--radius-btn);
}
.btn-main:active{ transform:translateY(1px); }
.btn-sub{
  display:block; width:100%; padding:13px 0; text-align:center; margin-top:10px;
  background:var(--card); border:1.5px solid var(--moss); border-radius:var(--radius-btn); font-weight:500;
}
.btn-line{ display:block; margin:16px auto 0; font-size:14px; color:#6B7A6E; text-decoration:underline; text-underline-offset:3px; }
.lock-msg{ text-align:center; font-size:14px; color:var(--pine); font-weight:700; margin-top:14px; }

/* timer */
.timer-wrap{ text-align:center; margin:8px 0 4px; }
.timer{ font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.timer.plus{ color:#B27C2E; }
.timer-hint{ font-size:13px; color:#6B7A6E; }

.blocks{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0 4px; min-height:18px; }
.blocks span{
  width:18px; height:18px; border-radius:5px; background:var(--amber);
  animation:pop .35s ease;
}
@keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion:reduce){ .blocks span{ animation:none; } *{transition:none !important;} }

/* after-session / tsuideni */
.msg-big{ text-align:center; font-size:20px; font-weight:700; margin:28px 0 18px; }
.tsuideni-label{ font-size:13px; color:#6B7A6E; margin-bottom:6px; }

/* ---- Capture ---- */
.cap-lead{ font-size:14px; color:#5C6B5F; margin:10px 2px 10px; }
.cap-status{ font-size:13px; color:var(--pine); font-weight:700; margin-top:10px; text-align:center; }
.pile{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
.pile-item{
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; gap:10px;
}
.pile-item .txt{ flex:1; }
.pile-item .mini{
  font-size:13px; font-weight:700; color:var(--pine);
  border:1.5px solid var(--pine); border-radius:10px; padding:5px 10px; white-space:nowrap;
}
.pile-item .del{ color:#9BAA9C; font-size:13px; }

.decomp{ background:var(--card); border:1.5px solid var(--moss); border-radius:var(--radius-card); padding:20px 18px; margin-top:16px; }
.decomp h3{ font-size:15px; margin-bottom:12px; }
.decomp .q{ font-weight:700; margin-bottom:8px; }
.step-list{ list-style:none; margin:12px 0; display:flex; flex-direction:column; gap:6px; }
.step-list li{ background:var(--paper); border-radius:10px; padding:8px 12px; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sug-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.sug{ text-align:left; background:var(--paper); border:1.5px dashed var(--moss); border-radius:10px; padding:9px 12px; font-size:14px; }
.row2{ display:flex; gap:10px; margin-top:12px; }
.row2 > *{ flex:1; }

details.backstage{ margin-top:34px; }
details.backstage summary{ font-size:13px; color:#6B7A6E; cursor:pointer; }
.proj-box{ background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:14px; }
.proj-box .head{ display:flex; justify-content:space-between; align-items:center; }
.proj-box ul{ list-style:none; margin-top:6px; }
.proj-box li{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; color:#5C6B5F; }
.proj-box .del{ color:#9BAA9C; font-size:12px; }
.del{ padding:10px 12px; white-space:nowrap; border:1.2px solid var(--moss-weak); border-radius:10px; }

/* ---- Done ---- */
.week-line{ text-align:center; margin:22px 0 6px; font-size:18px; }
.week-line b{ font-size:34px; color:var(--pine); }
.done-day{ margin-top:20px; }
.done-day h3{ font-size:13px; color:#6B7A6E; font-weight:500; margin-bottom:8px; }
.done-item{
  background:var(--card); border:1.5px solid var(--moss-weak); border-radius:14px;
  padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; font-size:15px;
}
.done-item .txt{ flex:1; }
.tag{ font-size:12px; font-weight:700; border-radius:8px; padding:3px 8px; white-space:nowrap; }
.tag.touch{ background:var(--amber-soft); color:#8A5F1E; }
.tag.done{ background:#DCE9E1; color:var(--pine); }
.tag.project{ background:var(--pine); color:#fff; }
.done-item .del{ color:#9BAA9C; font-size:12px; }

/* ---- overlay(90分弁) ---- */
.overlay{
  position:fixed; inset:0; background:rgba(38,48,42,.45);
  display:flex; align-items:center; justify-content:center; padding:24px; z-index:30;
}
.overlay .box{ background:var(--card); border-radius:var(--radius-card); padding:26px 22px; max-width:340px; width:100%; text-align:center; }
.overlay .box p{ margin-bottom:18px; font-weight:700; }

/* ---- nav ---- */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--card); border-top:1.5px solid var(--moss-weak);
  display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;
}
nav.tabs button{
  flex:1; padding:14px 0 12px; font-size:14px; color:#8A988C; font-weight:500;
}
nav.tabs button[aria-current="true"]{ color:var(--pine); font-weight:700; }
</style>
</head>
<body>

<header class="app">
  <div class="bar">
    <button id="help-btn" aria-label="?">?</button>

  </div>
</header>

<main>
  <section id="view-now" aria-label="Now"></section>
  <section id="view-capture" hidden aria-label="Capture"></section>
  <section id="view-done" hidden aria-label="Done"></section>
</main>

<nav class="tabs" aria-label="Views">
  <button data-v="capture"></button>
  <button data-v="now" aria-current="true"></button>
  <button data-v="done"></button>
</nav>

<div id="overlay-root"></div>

   - 成功の定義は「完了」ではなく「触った」

   - 5分経過は停止ではなく通過点(自動でカウントアップ継続)
   - 90分で休憩を提案する安全弁
   多言語: LANGS辞書 + t()。言語はlocalStorageに保存。
   AI分解: claude.ai のartifact環境ではそのまま動作。

===================================================================== */

const LANG_ORDER = ["ja","en","hi","ko","zh","es","fr"];

function detectLang(){
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "ja").toLowerCase();
  for(const c of LANG_ORDER){ if(nav.startsWith(c)) return c; }
  return "en";
}

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(!s.lang) s.lang = "ja";
      (s.pile || []).forEach(i => delete i.pending); // 処理中のまま閉じた場合の掃除
      return s;
    }
  }catch(e){}
  return { projects:[], pile:[], done:[], lastPid:null, lang: detectLang() };
}

function detectType(text){
  const t = String(text || "");
  for(const [key, def] of Object.entries(TYPES)){
    if(key === "generic") continue;
    if((def.kw || []).some(k => t.includes(k))) return key;
  }
  return null;
}

/* 課題文から一歩を作る。
   objHint: 「手元に使うものは?」への答え(任意)。答えなくても必ず一歩は返る。 */
function makeStep(text, level, objHint){
  const type = detectType(text) || "generic";
  const def = TYPES[type];
  const hint = (objHint && objHint.trim()) ? objHint.trim() : "";
  // ヒントがあり、型ごとの専用系列がある場合はそちらを使う
  const chain = (hint && def.hinted) ? def.hinted : def.chain;
  const i = Math.min(Math.max(level || 0, 0), chain.length - 1);
  const obj = hint || def.obj;
  return chain[i].split("{o}").join(obj);
}
function maxLevel(text){
  const type = detectType(text) || "generic";
  return TYPES[type].chain.length - 1;
}
/* 型が判定できたか(=一問尋ねる必要があるか) */
function needsHint(text){ return detectType(text) === null; }

  //(預ける経路と書き出す経路で扱いを変えないため)
  if(S.projects.length < MAX_PROJECTS){
    const waiting = S.pile.filter(i => !i.pending);
    for(const it of waiting){
      if(S.projects.length >= MAX_PROJECTS) break;
      const steps = (it.steps && it.steps.length) ? it.steps : [makeStep(it.text, 0, "")];
      S.projects.push({ id: uid(), name: it.text, deadline: it.deadline || null,
        level: 0, objHint: "", queue: [...steps], resumeNote: "" });
      S.pile = S.pile.filter(x => x.id !== it.id);
    }
    save();
  }
  const cands = S.projects.filter(p => p.queue.length > 0);
  const now = Date.now();
  const urgent = cands.filter(p => p.deadline && (new Date(p.deadline) - now) <= URGENT_DAYS*864e5)
                      .sort((a,b) => new Date(a.deadline) - new Date(b.deadline));
  const rest = cands.filter(p => !urgent.includes(p));
  // 前回中断した課題を先頭へ(「続きから」として出す。離れる手段は常に残す)
  const resumeIdx = rest.findIndex(p => p.id === S.lastTouched);
  if(resumeIdx > 0) rest.unshift(rest.splice(resumeIdx, 1)[0]);
  return [...urgent, ...rest];
}

/* 課題をひとつ預かる。分解も分類も本人に求めない */
function entrust(text){
  const p = { id: uid(), name: text, deadline: null, level: 0, objHint: "", queue: [], resumeNote: "" };
  p.queue = [makeStep(text, 0, "")];
  S.projects.push(p);
  save();
  if(needsHint(text)) ui.hintFor = text;   // 判定できない時だけ一問尋ねる
  renderNow();
  aiRefine(p);                              // AIがあれば具体性を高める(無くても成立)
}

/* もっと小さく: 進行方向ではなく、その行動に必要な準備へ戻す */
function shrinkStep(p){
  const max = maxLevel(p.name);
  if((p.level || 0) >= max){ renderNow(); return; }
  p.level = (p.level || 0) + 1;
  p.queue[0] = makeStep(p.name, p.level, p.objHint || "");
  p.aiRefined = false;
  save();
  renderNow();
  aiRefine(p);
}

/* AIは一歩の具体性を高めるだけ。失敗しても辞書の一歩がそのまま残る */
async function aiRefine(p){
  const items = await callAI([p.name + (p.objHint ? "(" + p.objHint + ")" : "")]);
  const cur = S.projects.find(x => x.id === p.id);
  if(!cur || !items) return;
  const steps = items.flatMap(it => it.steps);
  const idx = Math.min(p.level || 0, steps.length - 1);
  if(steps[idx]){ cur.queue[0] = steps[idx]; cur.aiRefined = true; save(); if(ui.view === "now" && !sess) renderNow(); }
}

/* ---------- セッション ---------- */
function startSession(p, action){
  sess = {
    pid: p.id, actionText: action, chosenMin: ui.minutes,

    chimed: false, valveShown: false, phase: "run", tick: null

  p.resumeNote = "";
  S.lastPid = p.id;
  S.lastTouched = p.id;  // 翌日の再開で最優先にする
  ui.skip = 0;
  save();
  renderNow();
  sess.tick = setInterval(tick, 500);
}
function sessSec(){ return Math.floor((Date.now() - sess.t0) / 1000); }

function tick(){
  if(!sess || sess.phase !== "run") return;
  const t0 = sessSec();
  const goal = sess.chosenMin * 60;
  const timerEl = document.getElementById("timer");
  const hintEl = document.getElementById("timer-hint");
  const cardEl = document.getElementById("sess-card");
  const blocksEl = document.getElementById("blocks");
  if(!timerEl) return;

  if(t0 < goal){
    timerEl.textContent = fmt(goal - t0);
    timerEl.classList.remove("plus");
  }else{
    if(!sess.chimed){ chime(); sess.chimed = true;
      if(hintEl) hintEl.textContent = t("keep_going"); }
    timerEl.textContent = "+" + fmt(t0 - goal);
    timerEl.classList.add("plus");
    if(cardEl) cardEl.classList.add("overtime");
  }
  const n = Math.floor(t0 / BLOCK_SEC);
  if(blocksEl && blocksEl.children.length !== n){
    blocksEl.innerHTML = "<span></span>".repeat(n);
  }
  if(t0 >= VALVE_SEC && !sess.valveShown){ sess.valveShown = true; showValve(); }
}
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

const pickMsg = () => { const m = L().end_msgs; return m[Math.floor(Math.random()*m.length)]; };
function pickNowLine(){ const m = L().now_msgs; return m[Math.floor(Math.random()*m.length)]; }

function onActionDone(){
  const p = S.projects.find(x => x.id === sess.pid);
  logDone("done", sess.actionText);
  if(p) p.queue.shift();
  save();
  sess.endMsg = pickMsg();
  sess.phase = (p && p.queue.length > 0) ? "tsuideni" : "projdone";
  renderNow();
}
function onStop(){
  const p0 = S.projects.find(x => x.id === sess.pid);
  if(p0){ p0.queue[0] = sess.actionText; save(); }  // メモが無くても同じ一歩に戻れる
  logDone("touch", sess.actionText);
  sess.endMsg = pickMsg();
  sess.phase = "resume";
  renderNow();
}
function logDone(kind, text){
  S.lastTouched = sess.pid;   // 翌日、ここに戻ってこられるようにする
  save();
  const min = Math.max(1, Math.round((Date.now() - sess.actT0) / 60000));
  S.done.push({ ts: Date.now(), text, min, kind });
  save();
}
function endSession(){
  clearInterval(sess.tick);
  // 空になったプロジェクトは自動で片づけ、準備できた山の項目を繰り上げる
  S.projects = S.projects.filter(p => p.queue.length > 0);
  promoteReady();
  save();
  sess.phase = "end";
  renderNow();
}

/* やわらかいチャイム */
function chime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const tt = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.12, tt + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.6);
      o.start(tt); o.stop(tt + 0.7);
    });
  }catch(e){}
}

/* =====================================================================
   AIパイプライン
   書き殴り → 切り分け → 各タスクの5分行動 → 空きがあれば自動でプロジェクト化
   失敗したら何も起こらず、改行分割の結果と手動分解にそのまま落ちる
===================================================================== */
async function aiCapture(entries){
  const items = await callAI(entries.map(e => e.text));
  const ids = new Set(entries.map(e => e.id));
  if(!items){
    S.pile.forEach(i => { if(ids.has(i.id)) delete i.pending; });
    save();
    if(ui.view === "capture" && !ui.decompId) renderCapture();
    return;
  }
  // 元の項目を、AIが切り分けた項目(steps付き)に置き換える
  S.pile = S.pile.filter(i => !ids.has(i.id));
  items.forEach(it => S.pile.push({
    id: uid(), text: it.title, steps: it.steps, deadline: it.deadline
  }));
  const beforeN = S.projects.length;
  promoteReady();
  const promoted = S.projects.length - beforeN;
  const waiting = items.length - promoted;
  const parts = [];
  if(promoted) parts.push(t("cap_done",{n:promoted}));
  if(waiting > 0) parts.push(t("ready_info"));
  ui.capMsg = parts.join(" ");
  save();
  if(ui.view === "capture" && !ui.decompId) renderCapture();
  else if(ui.view === "now" && !sess) renderNow();
}

/* 空きスロットがあれば、準備できた山の項目を古い順に自動でプロジェクト化 */
function promoteReady(){
  while(S.projects.length < MAX_PROJECTS){
    const it = S.pile.find(p => p.steps && p.steps.length);
    if(!it) break;
    S.projects.push({
      id: uid(), name: it.text, deadline: it.deadline || null,
      queue: [...it.steps], resumeNote: ""
    });
    S.pile = S.pile.filter(p => p.id !== it.id);
  }
}

/* AI呼び出し共通部: Netlify Function優先、artifact環境の直接呼び出しにフォールバック */
async function callAI(tasks){
  const today = new Date().toISOString().slice(0,10);
  try{
    const r = await fetch(FN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tasks, lang: L().aiLang, today })
    });
    if(r.ok){
      const d = await r.json();
      const items = sanitizeItems(d.items);
      if(items) return items;
    }
  }catch(e){}
  try{
    const res = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: buildPrompt(tasks, L().aiLang, today) }]
      })
    });
    const data = await res.json();
    const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    return sanitizeItems(JSON.parse(text.replace(/```json|```/g, "").trim()));
  }catch(e){}
  return null;
}
function sanitizeItems(items){
  if(!Array.isArray(items)) return null;
  const out = items
    .filter(it => it && typeof it.title === "string" && it.title.trim() && Array.isArray(it.steps) && it.steps.length)
    .map(it => ({
      title: it.title.trim().slice(0, 40),
      deadline: /^\d{4}-\d{2}-\d{2}$/.test(it.deadline || "") ? it.deadline : null,
      steps: it.steps.map(String).slice(0, 6)
    }));
  return out.length ? out : null;
}
function buildPrompt(tasks, lang, today){
  return `You will receive short task notes someone scribbled down. Some notes may contain multiple separate tasks run together in one line.
Notes:
${tasks.map(x => "- " + x).join("\n")}
Do two things:
1) Split them into separate tasks (one entry per real task).
2) For each task, produce: "title" (short, max 20 characters, in the same language the note was written in), "deadline" (YYYY-MM-DD only if a date is explicitly stated in the note; today is ${today}; otherwise null), and "steps": 3 to 6 physical actions of under 5 minutes each, written in ${lang}. The first step must be extra small (open a file / look at a page level). No vague verbs like "think about" or "organize".
Reply ONLY with a JSON array: [{"title":"...","deadline":null,"steps":["...","..."]}]`;
}

/* 手動フロー内のAIは「提案」を出すだけ。採用するかは本人が選ぶ */
async function aiDecompose(item, btn){
  btn.textContent = t("ai_busy"); btn.disabled = true;
  const items = await callAI([item.text]);
  if(items){
    ui.decompSuggests = items.flatMap(it => it.steps);
    renderDecomp();
    return;
  }
  btn.textContent = t("ai_fail");
  btn.disabled = true;
}

function assignProject(item){
  const root = document.getElementById("decomp-root");
  const canCreate = S.projects.length < MAX_PROJECTS;
  root.innerHTML = `
    <div class="decomp">
      <h3>${t("asg_title")}</h3>
      ${S.projects.map(p => `<button class="btn-sub" data-pid="${p.id}">${esc(p.name)}</button>`).join("")}
      ${canCreate ? `
        <div style="margin-top:14px">
          <input type="text" id="np-name" value="${esc(item.text.slice(0,20))}">
          <div style="margin-top:8px; font-size:13px; color:#6B7A6E">${t("asg_deadline")}</div>
          <input type="date" id="np-date">
          <button class="btn-main" id="np-make" style="margin-top:10px">${t("asg_make")}</button>
        </div>`
        : `<p style="margin-top:12px; font-size:14px; color:#6B7A6E">${t("asg_max")}</p>`}
      <button class="btn-line" id="asg-cancel">${t("dec_cancel")}</button>
    </div>`;

  const finish = (p) => {
    p.queue.push(...ui.decompSteps);
    S.pile = S.pile.filter(x => x.id !== item.id);
    ui.decompId = null; ui.decompSteps = []; ui.decompSuggests = [];
    save(); switchView("now");
  };
  root.querySelectorAll("[data-pid]").forEach(b =>
    b.onclick = () => finish(S.projects.find(p => p.id === b.dataset.pid)));
  const mk = root.querySelector("#np-make");
  if(mk) mk.onclick = () => {
    const name = root.querySelector("#np-name").value.trim() || item.text.slice(0,20);
    const date = root.querySelector("#np-date").value || null;
    const p = { id: uid(), name, deadline: date, queue: [], resumeNote: "" };
    S.projects.push(p); finish(p);
  };
  root.querySelector("#asg-cancel").onclick = () => { ui.decompId = null; ui.decompSuggests = []; renderCapture(); };
}

/* ---------- アプリ内ダイアログ ----------
   標準のalert/confirm/promptは埋め込みプレビュー等で遮断されるため使わない */
function dialog(html){
  const root = document.getElementById("overlay-root");
  root.innerHTML = `<div class="overlay" role="dialog"><div class="box" style="text-align:left">${html}</div></div>`;
  return root;
}
function closeDialog(){ document.getElementById("overlay-root").innerHTML = ""; }
function showNotice(msg){
  const root = dialog(`<p style="font-weight:500">${esc(msg)}</p><button class="btn-main" id="dlg-ok">OK</button>`);
  root.querySelector("#dlg-ok").onclick = closeDialog;
}
function showConfirm(msg, onYes){
  const root = dialog(`<p style="font-weight:500">${esc(msg)}</p>
    <button class="btn-main" id="dlg-yes">OK</button>
    <button class="btn-sub" id="dlg-no">${t("dec_cancel")}</button>`);
  root.querySelector("#dlg-yes").onclick = () => { closeDialog(); onYes(); };
  root.querySelector("#dlg-no").onclick = closeDialog;
}
function showTextDialog(msg, value, onOk){
  const root = dialog(`<p style="font-weight:500">${esc(msg)}</p>
    <textarea id="dlg-text" style="min-height:120px; font-size:12px"></textarea>
    <button class="btn-main" id="dlg-ok" style="margin-top:12px">OK</button>
    <button class="btn-sub" id="dlg-cancel">${t("dec_cancel")}</button>`);
  const ta = root.querySelector("#dlg-text");
  ta.value = value || "";
  if(value && ta.select) ta.select();
  root.querySelector("#dlg-ok").onclick = () => { const v = ta.value; closeDialog(); if(onOk) onOk(v); };
  root.querySelector("#dlg-cancel").onclick = closeDialog;
}

/* ---------- データの書き出し/取り込み(機種変更・localStorage消失対策) ---------- */
function exportData(){
  const json = JSON.stringify(S);
  const fallback = () => showTextDialog(t("exp_manual"), json, null);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(() => showNotice(t("exp_ok")), fallback);
  }else{
    fallback();
  }
}
async function testAI(){
  const today = new Date().toISOString().slice(0,10);
  try{
    const r = await fetch(FN_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tasks: ["test"], lang: L().aiLang, today })

      if(Array.isArray(d.items) && d.items.length){ showNotice(t("ai_ok_fn")); return; }

function resetAll(){
  showConfirm(t("reset_confirm"), () => {
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    S = load();
    applyLang();
    switchView("now");
    if(!S.welcomed) showWelcome();
  });
}
function importData(){
  showTextDialog(t("imp_prompt"), "", raw => {
    if(!raw || !raw.trim()) return;
    let d;
    try{
      d = JSON.parse(raw);
      if(!Array.isArray(d.projects) || !Array.isArray(d.done) || !Array.isArray(d.pile)) throw new Error("shape");
    }catch(e){ showNotice(t("imp_bad")); return; }
    showConfirm(t("imp_confirm"), () => {
      if(!d.lang) d.lang = S.lang;
      S = d; save(); applyLang(); render();
    });
  });
}

/* ---------- 裏方(プロジェクト管理・最小限) ---------- */
function renderBackstage(){
  const root = document.getElementById("proj-root");
  if(!S.projects.length){
    root.innerHTML = `<p style="font-size:13px; color:#6B7A6E; margin-top:8px">${t("back_empty")}</p>`;
    root.innerHTML += `<p style="font-size:11px; color:#9BAA9C; margin-top:10px">${APP_VER}</p>`;
    return;
  }
  root.innerHTML = S.projects.map(p => `
    <div class="proj-box">
      <div class="head">
        <b>${esc(p.name)}</b>
        <button class="del" data-cmd="proj-del" data-id="${p.id}">${t("del_proj")}</button>
      </div>
      <ul>${p.queue.map((q,i)=>`<li><span>${esc(q)}</span><button class="del" data-cmd="step-del" data-pid="${p.id}" data-i="${i}">${t("delete")}</button></li>`).join("")}</ul>
    </div>`).join("") + `<p style="font-size:11px; color:#9BAA9C; margin-top:10px">${APP_VER}</p>`;
}

/* =====================================================================
   Done ビュー — 積み上げ型のみ。空白日・未達の可視化はしない。
===================================================================== */
function renderDone(){
  const el = document.getElementById("view-done");
  const weekAgo = Date.now() - 7*864e5;
  const week = S.done.filter(d => d.ts >= weekAgo).length;

  if(!S.done.length){
    el.innerHTML = `<div class="now-empty"><p>${t("done_empty")}</p></div>`;
    return;
  }

  const byDay = {};
  [...S.done].reverse().forEach(d => {
    const day = new Date(d.ts).toLocaleDateString(L().locale, { month:"long", day:"numeric", weekday:"short" });
    (byDay[day] = byDay[day] || []).push(d);
  });

  el.innerHTML = `
    <div class="week-line">${t("done_week",{n:`<b>${week}</b>`})}</div>
    ${Object.entries(byDay).map(([day, items]) => `
      <div class="done-day">
        <h3>${esc(day)}</h3>
        ${items.map(d => `
          <div class="done-item">
            <span class="txt">${esc(d.text)}</span>
            ${d.min ? `<span style="font-size:12px;color:#8A988C">${t("min_unit",{n:d.min})}</span>` : ""}
            <span class="tag ${d.kind}">${d.kind === "done" ? t("tag_done") : d.kind === "project" ? t("tag_proj") : t("tag_touch")}</span>
            <button class="del" data-cmd="done-del" data-ts="${d.ts}">${t("delete")}</button>
          </div>`).join("")}
      </div>`).join("")}`;

}

/* ---------- 削除系はイベント委任 ----------
   再描画やバインドのタイミングに依存しないよう、文書全体で一括受信する */
document.addEventListener("click", e => {
  const btn = e.target && e.target.closest ? e.target.closest("[data-cmd]") : null;
  if(!btn) return;
  const cmd = btn.dataset.cmd;
  if(cmd === "pile-dec"){ openDecomp(btn.dataset.id); return; }
  if(cmd === "ready-info"){ showNotice(t("ready_info")); return; }
  if(cmd === "pile-del"){
    S.pile = S.pile.filter(x => x.id !== btn.dataset.id);
    save(); renderCapture(); return;
  }
  if(cmd === "proj-del"){
    const p = S.projects.find(x => x.id === btn.dataset.id);
    if(!p) return;
    showConfirm(t("del_confirm",{t:p.name}), () => {
      S.projects = S.projects.filter(x => x.id !== p.id);
      promoteReady(); save(); renderCapture();
    });
    return;
  }
  if(cmd === "step-del"){
    const p = S.projects.find(x => x.id === btn.dataset.pid);
    if(!p) return;
    p.queue.splice(+btn.dataset.i, 1);
    save(); renderCapture(); return;
  }
  if(cmd === "done-del"){
    S.done = S.done.filter(d => d.ts !== +btn.dataset.ts);
    save(); renderDone(); return;
  }
});

/* ---------- 初回だけの1枚カード(操作説明ではなく、成功の定義を先に渡す) ---------- */

  const root = document.getElementById("overlay-root");

      <div class="box" style="text-align:left">
        <p style="color:var(--pine); margin-bottom:10px">${L().title}</p>
        <div class="wel-langs">${LANG_ORDER.map(c => `<button data-l="${c}" aria-pressed="${c===S.lang}">${LANGS[c].langName}</button>`).join("")}</div>
        <p style="font-weight:500">${t("wel_body")}</p>
        <p style="font-size:14px; color:#5C6B5F; margin-bottom:14px">${t("wel_flow")}</p>
        <button class="btn-main" id="wel-ok">${t("wel_btn")}</button>
      </div>
    </div>`;
  root.querySelectorAll(".wel-langs button").forEach(b => b.onclick = () => {
    S.lang = b.dataset.l; save();
    ui.nowLine = pickNowLine();

  root.querySelector("#wel-ok").onclick = () => {

  };
}

/* ---------- 起動 ---------- */
applyLang();
switchView("now");
if(!S.welcomed) showWelcome();
